services:
  app:
    image: webdevops/php-nginx:8.4-alpine
    container_name: anakata-api
    environment:
        - WEB_DOCUMENT_ROOT=/app/public
    networks:
      - traefik-network
      - mysql-network
    working_dir: /app
    ports:
      - 8000:80
      - 8001:8080
    volumes:
      - .:/app
      - .docker/prod.supervisord.conf:/opt/docker/etc/supervisor.d/jobs.conf
      - .docker/nginx-vhost-common.d/sse.conf:/opt/docker/etc/nginx/vhost.common.d/sse.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anakata-api.rule=Host(`anakata.local`)"
      - "traefik.http.routers.anakata-api.service=anakata-api"
      - "traefik.http.services.anakata-api.loadbalancer.server.port=80"
      - "traefik.http.routers.anakata-ws.rule=Host(`ws.anakata.local`)"
      - "traefik.http.routers.anakata-ws.service=anakata-ws"
      - "traefik.http.services.anakata-ws.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-network"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  traefik-network:
    external: true
  mysql-network:
    external: true
